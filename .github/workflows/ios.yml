name: iOS CI

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_INSTALL_CLEANUP: "1"

jobs:
  core:
    name: Core tests (Linux)
    runs-on: ubuntu-24.04
    # Official Swift image: pinned toolchain, no third-party action and no
    # dependency on a JavaScript action runtime.
    container: swift:6.3.3
    steps:
      - uses: actions/checkout@v7

      - name: Swift version
        run: swift --version

      - name: swift test (BookTransCore)
        run: swift test --package-path Packages/BookTransCore

  ios:
    name: iOS build + IPA
    runs-on: macos-26
    needs: core
    steps:
      - uses: actions/checkout@v7

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Resolve simulator destination
        id: dest
        run: |
          set -euo pipefail
          DEST=$(xcrun simctl list devices available --json | jq -r '
            [ .devices | to_entries[]
              | select(.key | startswith("com.apple.CoreSimulator.SimRuntime.iOS"))
              | .key as $k
              | ($k | capture("iOS-(?<v>[0-9-]+)$").v | gsub("-"; ".")) as $os
              | .value[] | select(.name | test("^iPhone"))
              | {name: .name, os: $os} ]
            | unique_by(.name + "|" + .os)
            | sort_by([ (.os | split(".") | map(tonumber)),
                        (if (.name | contains("iPhone 17")) then 1 else 0 end) ])
            | last
            | "platform=iOS Simulator,name=\(.name),OS=\(.os)"')
          if [ -z "$DEST" ] || [ "$DEST" = "null" ]; then
            echo "No iOS simulator found"; xcrun simctl list devices available; exit 1
          fi
          xcodebuild -version
          echo "destination=$DEST"
          echo "dest=$DEST" >> "$GITHUB_OUTPUT"

      - name: Run unit tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project BookTrans.xcodeproj \
            -scheme BookTrans \
            -destination "${{ steps.dest.outputs.dest }}" \
            CODE_SIGNING_ALLOWED=NO

      - name: Build device binary (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project BookTrans.xcodeproj \
            -scheme BookTrans \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package unsigned IPA
        run: |
          set -eu
          APP=build/Build/Products/Release-iphoneos/BookTrans.app
          test -d "$APP" || { echo "missing $APP"; exit 1; }
          rm -rf Payload BookTrans.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry BookTrans.ipa Payload
          ls -la BookTrans.ipa
          echo "bundle id: $(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' Payload/BookTrans.app/Info.plist)"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v7
        with:
          name: BookTrans-ipa
          path: BookTrans.ipa
          retention-days: 14
          if-no-files-found: error
